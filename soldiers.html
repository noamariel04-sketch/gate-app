<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עדכון רכב - פלוגה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { mainBg: '#1e293b', accent: '#38bdf8' } } } }
    </script>
    <style>
        body { background-color: #0f172a; color: white; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-mainBg w-full max-w-md p-8 rounded-2xl shadow-[0_0_20px_rgba(56,189,248,0.2)] border border-slate-700 text-center">
        <h2 class="text-2xl font-bold text-accent mb-2">רישום רכב לפלוגה</h2>
        <p class="text-slate-400 text-sm mb-6">בחר את שמך מהרשימה והזן את מספר הרכב שלך.</p>

        <div class="space-y-5 text-right">
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-300">בחר שם מלא:</label>
                <!-- רשימה נפתחת שנטענת אוטומטית -->
                <select id="soldierSelect" class="w-full p-4 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-accent">
                    <option value="">טוען רשימת חיילים מהענן... ⏳</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-300">מספר רכב (ספרות בלבד)</label>
                <input type="number" id="carNum" placeholder="למשל 1234567" class="w-full p-4 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-accent">
            </div>
            
            <button id="submitBtn" class="w-full bg-accent text-[#0f172a] py-4 rounded-xl font-bold text-lg hover:bg-sky-400 transition mt-2">הוסף רכב למערכת הש"ג</button>
        </div>
        
        <div id="successMsg" class="hidden mt-4 bg-green-900/50 text-green-400 p-4 rounded border border-green-700 font-bold">
            ✅ הרכב נוסף למאגר שלך בהצלחה! אפשר לסגור את החלון.
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB89Uiy2id8pEOxRZEmPaIq94wHaNybOYw",
            authDomain: "gate-app-a8c86.firebaseapp.com",
            projectId: "gate-app-a8c86",
            storageBucket: "gate-app-a8c86.firebasestorage.app",
            messagingSenderId: "127100922909",
            appId: "1:127100922909:web:9d2f17bd83af386d14eaf4"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // טעינת שמות החיילים ברגע שהדף עולה
        async function loadSoldiers() {
            const selectElement = document.getElementById('soldierSelect');
            try {
                const snap = await getDocs(collection(db, "pluga_members"));
                let soldiers = [];
                snap.forEach(doc => soldiers.push(doc.data()));
                
                // סידור הרשימה לפי א"ב
                soldiers.sort((a, b) => a.fullName.localeCompare(b.fullName, 'he'));
                
                let html = '<option value="">-- בחר את שמך מהרשימה --</option>';
                soldiers.forEach(s => {
                    html += `<option value="${s.id}">${s.fullName}</option>`;
                });
                
                selectElement.innerHTML = html;
            } catch(e) {
                selectElement.innerHTML = '<option value="">שגיאה בטעינת הרשימה. פנה לקצין</option>';
                console.error(e);
            }
        }
        
        loadSoldiers(); // קריאה לפונקציה מיד

        // שליחת הטופס
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const selectedId = document.getElementById('soldierSelect').value;
            const car = document.getElementById('carNum').value.trim();
            
            if(!selectedId) { alert("חובה לבחור שם מהרשימה."); return; }
            if(!car) { alert("חובה להזין מספר רכב."); return; }
            
            try {
                // עדכון הרכב תחת כרטיס החייל המדויק
                const soldierRef = doc(db, "pluga_members", selectedId);
                await updateDoc(soldierRef, { cars: arrayUnion(car) });
                
                document.getElementById('successMsg').classList.remove('hidden');
                
                // איפוס מספר הרכב (השם נשאר במקרה והוא רוצה להוסיף עוד רכב)
                document.getElementById('carNum').value = '';
                
                setTimeout(() => {
                    document.getElementById('successMsg').classList.add('hidden');
                }, 5000);
            } catch(error) {
                console.error(error);
                alert("שגיאת תקשורת מול הענן. נסה שנית.");
            }
        });
    </script>
</body>
</html>
