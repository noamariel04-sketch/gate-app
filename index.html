<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת בקרת כניסה - ש"ג</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { darkBg: '#0f172a', panelBg: '#1e293b', neonBlue: '#38bdf8', neonGreen: '#22c55e' } } }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="bg-panelBg border-b-2 border-neonBlue p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black text-neonBlue tracking-wider">GATE<span class="text-white">CONTROL</span></h1>
            <div class="flex gap-3">
                <button id="btnGuard" class="bg-slate-700 text-white px-5 py-2 rounded-md font-semibold border border-slate-600 transition hover:bg-slate-600">חיפוש ואימות</button>
                <button id="btnGuest" class="bg-slate-700 text-white px-5 py-2 rounded-md font-semibold border border-slate-600 transition hover:bg-slate-600">רישום אורח מזדמן</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 mt-4">

        <div id="guardTab" class="tab-content active bg-panelBg p-6 rounded-xl shadow-2xl border border-slate-700">
            <h2 class="text-xl font-bold mb-4 text-neonBlue">איתור נכנסים / רכב חוסם</h2>
            <div class="flex flex-col md:flex-row gap-3 mb-6">
                <input type="text" id="searchInput" placeholder="הכנס מס' רכב או שם לחייל/אורח..." class="w-full p-4 bg-slate-800 border border-slate-600 rounded-lg text-lg text-white focus:outline-none focus:border-neonBlue transition placeholder-slate-400">
                <button id="searchBtn" class="bg-neonBlue text-darkBg px-8 py-4 rounded-lg font-black text-lg hover:bg-sky-400 transition shadow-[0_0_15px_rgba(56,189,248,0.4)]">חפש</button>
            </div>
            <div id="searchResultsArea" class="space-y-4"></div>
        </div>

        <div id="guestTab" class="tab-content bg-panelBg p-6 rounded-xl shadow-2xl border border-slate-700">
            <h2 class="text-xl font-bold mb-4 text-neonGreen">רישום כניסת גורם חוץ</h2>
            <div class="space-y-4">
                <input type="text" id="guestName" placeholder="שם מלא" class="w-full p-3 bg-slate-800 border border-slate-600 rounded text-white focus:border-neonGreen focus:outline-none">
                <input type="tel" id="guestPhone" placeholder="מספר טלפון (חשוב לחסימה)" class="w-full p-3 bg-slate-800 border border-slate-600 rounded text-white focus:border-neonGreen focus:outline-none">
                <input type="text" id="guestCar" placeholder="מספר רכב" class="w-full p-3 bg-slate-800 border border-slate-600 rounded text-white focus:border-neonGreen focus:outline-none">
                <button id="registerGuestBtn" class="w-full bg-neonGreen text-darkBg py-4 rounded-lg font-black text-lg mt-4 hover:bg-green-500 transition shadow-[0_0_15px_rgba(34,197,94,0.4)]">רשום אורח ופתח שער</button>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB89Uiy2id8pEOxRZEmPaIq94wHaNybOYw",
            authDomain: "gate-app-a8c86.firebaseapp.com",
            projectId: "gate-app-a8c86",
            storageBucket: "gate-app-a8c86.firebasestorage.app",
            messagingSenderId: "127100922909",
            appId: "1:127100922909:web:9d2f17bd83af386d14eaf4"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.currentSearchResults = {};

        document.getElementById('btnGuard').addEventListener('click', () => switchTab('guardTab'));
        document.getElementById('btnGuest').addEventListener('click', () => switchTab('guestTab'));

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        document.getElementById('searchBtn').addEventListener('click', async () => {
            const input = document.getElementById('searchInput').value.trim();
            const resultsArea = document.getElementById('searchResultsArea');
            if(!input) return;
            
            resultsArea.innerHTML = '<p class="text-neonBlue text-center font-bold">מחפש נתונים בענן... ⏳</p>';
            let found = [];
            window.currentSearchResults = {}; 

            try {
                const plugaSnap = await getDocs(collection(db, "pluga_members"));
                plugaSnap.forEach(doc => {
                    const data = doc.data();
                    if((data.fullName && data.fullName.includes(input)) || (data.cars && data.cars.includes(input))) {
                        found.push({...data, type: 'pluga'});
                    }
                });

                const guestSnap = await getDocs(collection(db, "guests"));
                guestSnap.forEach(doc => {
                    const data = doc.data();
                    if((data.fullName && data.fullName.includes(input)) || (data.cars && data.cars.includes(input))) {
                        found.push({...data, type: 'guest'});
                    }
                });

                if(found.length === 0) {
                    resultsArea.innerHTML = `<div class="p-4 bg-red-900/50 border border-red-500 rounded text-red-200">לא נמצאו תוצאות. ודא שהשם או המספר נכונים.</div>`;
                    return;
                }

                resultsArea.innerHTML = '';
                found.forEach((person) => {
                    const personId = person.id || person.fullName; 
                    window.currentSearchResults[personId] = person;
                    
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 p-5 rounded-lg border border-slate-600 mb-4";
                    
                    const phoneDisplay = person.phone ? person.phone : 'לא זמין';
                    const carsDisplay = (person.cars && person.cars.length > 0) ? person.cars.join(' | ') : 'אין רכבים רשומים';
                    const badge = person.type === 'pluga' ? '<span class="bg-blue-900 text-xs px-2 py-1 rounded ml-2 border border-blue-700">פלוגה</span>' : '<span class="bg-orange-900 text-xs px-2 py-1 rounded ml-2 border border-orange-700">אורח מזדמן</span>';
                    
                    let html = `
                        <div class="border-b border-slate-700 pb-3 mb-3">
                            <h3 class="text-xl font-bold text-white flex items-center">${person.fullName} ${badge}</h3>
                            <p class="text-slate-300 mt-2 font-mono">📞 טלפון לאיתור: ${phoneDisplay}</p>
                            <div class="mt-2 bg-slate-700 p-2 rounded text-neonBlue font-bold">
                                🚗 רכבים מורשים: <span class="text-white">${carsDisplay}</span>
                            </div>
                        </div>
                    `;

                    if(person.type === 'pluga') {
                        html += `
                            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 mb-4">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-slate-400 text-sm">אימות זהות בשער:</span>
                                    <button onclick="window.changeQuestion('${personId}')" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded transition border border-slate-500">🔄 החלף שאלה</button>
                                </div>
                                <p class="text-lg font-bold text-slate-200" id="qLabel_${personId}">שאל: מה עיר המגורים שלך?</p>
                                <p class="text-neonGreen mt-1 text-lg">תשובה מצופה: <span class="font-black" id="qAnswer_${personId}">${person.city || 'לא ידוע'}</span></p>
                            </div>
                        `;
                    }

                    // אופציית הוספת רכב פעילה עכשיו גם לחיילים וגם לאורחים!
                    html += `
                        <div class="flex gap-2 mb-4">
                            <input type="text" id="newCar_${personId}" placeholder="הוסף מס' רכב חדש..." class="w-full p-3 bg-slate-700 border border-slate-600 rounded text-white focus:outline-none focus:border-neonBlue">
                            <button onclick="window.addCar('${personId}', '${person.type}')" class="bg-slate-600 hover:bg-slate-500 text-white px-6 rounded font-bold transition border border-slate-500">הוסף</button>
                        </div>
                        <button onclick="alert('✅ הכניסה אושרה ותועדה ביומן!'); document.getElementById('searchResultsArea').innerHTML='';" class="w-full bg-neonBlue text-darkBg py-3 rounded font-black text-lg hover:bg-sky-400 transition mt-2">אמת כניסה והכנס ליומן</button>
                    `;

                    card.innerHTML = html;
                    resultsArea.appendChild(card);
                });

            } catch(e) {
                resultsArea.innerHTML = `<p class="text-red-500">שגיאת תקשורת: ${e.message}</p>`;
            }
        });

        // שאלות האימות המעודכנות (ללא תאריך לידה)
        window.changeQuestion = function(id) {
            const person = window.currentSearchResults[id];
            if(!person) return;
            
            const questions = [
                { q: 'מה עיר המגורים שלך?', a: person.city || 'לא מעודכן במערכת' },
                { q: 'מה המספר האישי שלך?', a: person.id || 'לא מעודכן במערכת' },
                { q: 'מהן 4 הספרות האחרונות של תעודת הזהות שלך?', a: person.tz ? person.tz.slice(-4) : 'לא מעודכן במערכת' }
            ];

            if(person.currentQIndex === undefined) person.currentQIndex = 0;
            person.currentQIndex = (person.currentQIndex + 1) % questions.length;
            
            const nextQ = questions[person.currentQIndex];
            document.getElementById(`qLabel_${id}`).innerText = 'שאל: ' + nextQ.q;
            document.getElementById(`qAnswer_${id}`).innerText = nextQ.a;
        };

        // הוספת רכב - תומך עכשיו גם באורחים וגם בפלוגה
        window.addCar = async function(id, type) {
            const input = document.getElementById(`newCar_${id}`);
            if(!input.value) return;
            
            const collectionName = type === 'pluga' ? 'pluga_members' : 'guests';
            
            try {
                await updateDoc(doc(db, collectionName, id), { cars: arrayUnion(input.value) });
                alert("🚗 הרכב נוסף למאגר בהצלחה!");
                input.value = '';
                document.getElementById('searchBtn').click(); 
            } catch(e) { console.error(e); }
        };

        document.getElementById('registerGuestBtn').addEventListener('click', async () => {
            const name = document.getElementById('guestName').value.trim();
            const phone = document.getElementById('guestPhone').value.trim();
            const car = document.getElementById('guestCar').value.trim();
            if(!name || !car) { alert("חובה להזין שם ומספר רכב"); return; }
            
            try {
                // המזהה של האורח יהיה פשוט השם שלו פלוס חותמת זמן כדי למנוע התנגשויות
                const guestId = `guest_${Date.now()}`;
                await setDoc(doc(db, "guests", guestId), {
                    id: guestId, fullName: name, phone: phone, cars: [car], type: 'guest'
                });
                alert("✅ כרטיס אורח נוצר ונשמר בענן בהצלחה!");
                document.getElementById('guestName').value = '';
                document.getElementById('guestPhone').value = '';
                document.getElementById('guestCar').value = '';
            } catch(e) { console.error(e); }
        });
    </script>
</body>
</html>
