<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עדכון רכב - פלוגה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { mainBg: '#1e293b', accent: '#38bdf8' } } } }
    </script>
    <style>body { background-color: #0f172a; color: white; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-mainBg w-full max-w-md p-8 rounded-2xl shadow-[0_0_20px_rgba(56,189,248,0.2)] border border-slate-700 text-center">
        <h2 class="text-2xl font-bold text-accent mb-2">רישום רכב לפלוגה</h2>
        <p class="text-slate-400 text-sm mb-6">הזן את פרטיך. הרכב יתווסף למאגר הש"ג ולא ימחק רכבים קודמים.</p>

        <div class="space-y-5 text-right">
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-300">שם ושם משפחה</label>
                <input type="text" id="soldierName" class="w-full p-4 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-accent">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-300">מספר אישי</label>
                <input type="number" id="soldierId" class="w-full p-4 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-accent">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-300">מספר רכב</label>
                <input type="number" id="carNum" class="w-full p-4 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-accent">
            </div>
            <button id="submitBtn" class="w-full bg-accent text-[#0f172a] py-4 rounded-xl font-bold text-lg hover:bg-sky-400 transition mt-2">שלח למאגר הש"ג</button>
        </div>
        
        <div id="successMsg" class="hidden mt-4 bg-green-900/50 text-green-400 p-3 rounded border border-green-700 text-sm">
            הנתונים נשלחו בהצלחה!
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB89Uiy2id8pEOxRZEmPaIq94wHaNybOYw",
            authDomain: "gate-app-a8c86.firebaseapp.com",
            projectId: "gate-app-a8c86",
            storageBucket: "gate-app-a8c86.firebasestorage.app",
            messagingSenderId: "127100922909",
            appId: "1:127100922909:web:9d2f17bd83af386d14eaf4"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const name = document.getElementById('soldierName').value.trim();
            const id = document.getElementById('soldierId').value.trim();
            const car = document.getElementById('carNum').value.trim();
            
            if(!name || !id || !car) { alert("נא למלא את כל השדות."); return; }
            
            try {
                const soldierRef = doc(db, "pluga_members", id);
                await updateDoc(soldierRef, { cars: arrayUnion(car) });
                
                document.getElementById('successMsg').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('soldierName').value = '';
                    document.getElementById('soldierId').value = '';
                    document.getElementById('carNum').value = '';
                    document.getElementById('successMsg').classList.add('hidden');
                }, 3000);
            } catch(error) {
                console.error(error);
                alert("שגיאה: ודא שהמספר האישי נכון ותואם למאגר שלנו.");
            }
        });
    </script>
</body>
</html>
