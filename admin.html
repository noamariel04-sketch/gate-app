<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>העלאת נתוני פלוגה - חלונית חכמה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- שיניתי את ספק ספריית קריאת האקסל לאחד יציב יותר -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-blue-600">יבוא אלפון רביד למאגר</h1>
        <input type="file" id="fileUpload" accept=".xlsx, .xls" class="mb-4 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        
        <p id="status" class="font-bold text-gray-700 mt-4 text-lg"></p>
        <!-- כאן תופיע הודעת השגיאה המדויקת במידה ותהיה כזו -->
        <p id="errorBox" class="text-red-600 mt-4 text-sm font-mono font-bold bg-red-50 p-2 rounded hidden"></p> 
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // החיבור שלך לפיירבייס
        const firebaseConfig = {
            apiKey: "AIzaSyB89Uiy2id8pEOxRZEmPaIq94wHaNybOYw",
            authDomain: "gate-app-a8c86.firebaseapp.com",
            projectId: "gate-app-a8c86",
            storageBucket: "gate-app-a8c86.firebasestorage.app",
            messagingSenderId: "127100922909",
            appId: "1:127100922909:web:9d2f17bd83af386d14eaf4"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function showError(msg) {
            const errBox = document.getElementById('errorBox');
            errBox.innerText += "\n" + msg;
            errBox.classList.remove('hidden');
            document.getElementById('status').innerText = "התרחשה שגיאה! ❌";
        }

        document.getElementById('fileUpload').addEventListener('change', (e) => {
            try {
                document.getElementById('status').innerText = "קורא את הקובץ... ⏳";
                document.getElementById('errorBox').classList.add('hidden');
                document.getElementById('errorBox').innerText = "";
                
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const sheetData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        uploadData(sheetData);
                    } catch(err) {
                        showError("שגיאה בפענוח קובץ האקסל: " + err.message);
                    }
                };
                
                // שיטה בטוחה יותר לקריאת קבצים
                reader.readAsArrayBuffer(file);
            } catch (err) {
                showError("שגיאה בקריאת הקובץ מהמחשב: " + err.message);
            }
        });

        async function uploadData(data) {
            document.getElementById('status').innerText = `מנסה להעלות ${data.length} שורות לענן... ⏳`;
            let count = 0;
            
            try {
                for(let row of data) {
                    // דילוג על שורות ריקות או שורות סיכום
                    if(!row['שם משפחה'] || row['שם משפחה'] === 'סה"כ') continue;
                    
                    const id = String(row['מספר אישי'] || row['תעודת זהות'] || `temp_${count}`);
                    
                    const soldier = {
                        id: id,
                        tz: String(row['תעודת זהות'] || ''),
                        firstName: String(row['שם פרטי'] || ''),
                        lastName: String(row['שם משפחה'] || ''),
                        fullName: `${row['שם פרטי'] || ''} ${row['שם משפחה'] || ''}`.trim(),
                        role: String(row['עיסוק מיועד'] || ''),
                        phone: String(row['מספר טלפון נייד עיקרי'] || ''),
                        city: String(row['כתובת עיקרית - עיר'] || ''),
                        type: 'pluga',
                        cars: [] 
                    };

                    await setDoc(doc(db, "pluga_members", id), soldier);
                    count++;
                }
                document.getElementById('status').innerText = `ההעלאה הסתיימה! ${count} חיילים נשמרו במאגר בהצלחה. ✅`;
            } catch(err) {
                showError("שגיאה בחסימת פיירבייס: " + err.message + "\n(כנראה שה-Rules ב-Firebase עדיין חוסמים כתיבה)");
            }
        }
    </script>
</body>
</html>
